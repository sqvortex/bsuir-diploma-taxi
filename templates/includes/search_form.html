{# Форма поиска рейсов: используется на главной и на странице поиска. #}
<form method="get" action="{% url 'core:search' %}" class="row g-3 align-items-end">
  <div class="col-12 col-md">
    <label class="form-label fw-semibold" for="id_from_city"><i class="bi bi-geo-alt"></i> {{ form.from_city.label }}</label>
    <input type="text" name="from_city" id="id_from_city" class="form-control form-control-lg" list="cities"
           placeholder="Минск" value="{{ form.from_city.value|default:'' }}" required>
  </div>
  <div class="col-12 col-md">
    <label class="form-label fw-semibold" for="id_to_city"><i class="bi bi-geo"></i> {{ form.to_city.label }}</label>
    <input type="text" name="to_city" id="id_to_city" class="form-control form-control-lg" list="cities"
           placeholder="Гомель" value="{{ form.to_city.value|default:'' }}" required>
  </div>
  <div class="col-12 col-md-3">
    <label class="form-label fw-semibold" for="id_date"><i class="bi bi-calendar3"></i> {{ form.date.label }}</label>
    <input type="date" name="date" id="id_date" class="form-control form-control-lg"
           value="{% if form.date.value %}{{ form.date.value|date:'Y-m-d'|default:form.date.value }}{% endif %}" required>
  </div>
  <div class="col-12 col-md-auto">
    <button class="btn btn-accent btn-lg w-100 px-4" type="submit"><i class="bi bi-search"></i> Найти</button>
  </div>
  <datalist id="cities">{% for city in cities %}<option value="{{ city }}">{% endfor %}</datalist>
  {% if form.non_field_errors or form.date.errors %}
    <div class="col-12">
      {% for error in form.non_field_errors %}<div class="text-danger small">{{ error }}</div>{% endfor %}
      {% for error in form.date.errors %}<div class="text-danger small">{{ error }}</div>{% endfor %}
    </div>
  {% endif %}
</form>
